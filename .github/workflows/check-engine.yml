# Phase 1 gate: detection package tests + native-tree smoke (engine E2E).
# CI fetches the pinned native binaries via scripts/fetch-native.sh — the same
# step release pipelines (Phase 4) reuse, so a broken pin fails here first.
name: check-engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
# Runner image: PINNED, not `ubuntu-latest`.
#
# `ubuntu-latest` resolves to 24.04 today (measured in this workflow's own run logs) and 26.04 is
# only a PUBLIC PREVIEW, so `-latest` will move the OS under a release with no commit to review —
# and this pipeline's version is commit-derived, so an unreviewed OS change lands in a release.
# Pinning makes the migration a deliberate, testable step: bump this line, run the workflow, read
# the log. `check.yml` floats its Deno version on purpose (see that file); the runner is pinned
# for the opposite reason.
  detection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Detection unit tests
        run: deno test --allow-all
        working-directory: detection

  engine-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          # The engine E2E extracts audio with ffmpeg. Runners do not ship it, so
          # this failed with NotFound on the first real CI run despite passing
          # locally. See check.yml for the same fix.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Fetch native binaries + models
        run: ./scripts/fetch-native.sh
      - name: Engine E2E (real whisper on bundled jfk.wav)
        run: deno test --allow-all tests/engine-e2e.test.ts
        working-directory: server
        env:
          # whisper CPU binaries need their bundled libs (LD_LIBRARY_PATH=.)
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/whisper/linux-x64