# Phase 0 gate: type-check, unit tests, frontend build.
# Nightly/release pipelines (Phase 4) depend on this workflow being green.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Type check
        run: deno check main.ts
        working-directory: server
      - name: Unit tests
        run: deno test --allow-all
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: svelte-check
        run: npm run check
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend