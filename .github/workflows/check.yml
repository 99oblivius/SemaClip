# Phase 0 gate: type-check, unit tests, frontend build.
# Nightly/release pipelines (Phase 4) depend on this workflow being green.
#
# `deno-version: v2.9.x` FLOATS ON PURPOSE and must stay floating even though
# release.yml pins v2.9.6 exactly: this job is the early-warning system for an
# upstream Deno 2.9 release breaking the type-check or the test suite, and a
# pinned version here would remove that signal. Release jobs pin because
# `deno desktop` is experimental — a new 2.9 patch can change packaging
# behaviour mid-release. Do not "fix" the inconsistency.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Workflow files are CODE, and a YAML error there fails a RELEASE rather than a check.
  #
  # Measured: an `inline python3 - <<'PY'` heredoc inside a `run: |` block put its terminator at
  # column 0, which ends the YAML block scalar — the whole release.yml became unparseable and the run
  # failed before a single step executed ("This run likely failed because of a workflow file issue").
  # Nothing in this repo validated workflow syntax, so the release pipeline was the first thing to
  # find out. This job runs on PRs and pushes, before a release can be cut.
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Workflow YAML parses, and no heredoc terminator sits at column 0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys

          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml unavailable; cannot validate workflows")

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(path))
                  print(f"ok      {path}")
              except Exception as exc:
                  print(f"INVALID {path}: {exc}")
                  bad = 1

              # A heredoc terminator (PY, EOF, ...) at column 0 inside a `run: |` block is the exact
              # failure above, and YAML cannot catch it because the file may still parse in other
              # tooling. Report it explicitly.
              for n, line in enumerate(open(path), 1):
                  if line.rstrip("\n") in ("PY", "EOF"):
                      print(f"INVALID {path}:{n}: heredoc terminator at column 0 inside a run block")
                      bad = 1
          sys.exit(bad)
          PY

# Runner image: PINNED, not `ubuntu-latest`.
#
# `ubuntu-latest` resolves to 24.04 today (measured in this workflow's own run logs) and 26.04 is
# only a PUBLIC PREVIEW, so `-latest` will move the OS under a release with no commit to review —
# and this pipeline's version is commit-derived, so an unreviewed OS change lands in a release.
# Pinning makes the migration a deliberate, testable step: bump this line, run the workflow, read
# the log. `check.yml` floats its Deno version on purpose (see that file); the runner is pinned
# for the opposite reason.
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Type check
        run: deno check main.ts
        working-directory: server
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          # Several tests spawn ffmpeg for real (fmp4 muxing, export, engine E2E).
          # GitHub runners do NOT ship it, so they failed with
          # "NotFound: Failed to spawn 'ffmpeg': entity not found" on the first
          # real CI run -- while passing locally on a machine that has it. The
          # production code no longer depends on PATH (the packaged app bundles
          # its own), but the TESTS still invoke the bare name.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Unit tests
        run: deno test --allow-all
        working-directory: server

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: svelte-check
        run: npm run check
        working-directory: frontend
      - name: Build
        run: npm run build

      - name: Frontend unit tests
        # THE UPDATE SURFACES HAD NO CI STEP AT ALL. The restart policy, the error surface and the
        # updater log were asserted by tests that nothing ran, so a change could break all three
        # with no signal. The update flow is the one path a user cannot exercise for themselves.
        run: npm test
        working-directory: frontend