# Phase 0 gate: type-check, unit tests, frontend build.
# Nightly/release pipelines (Phase 4) depend on this workflow being green.
#
# `deno-version: v2.9.x` FLOATS ON PURPOSE and must stay floating even though
# release.yml pins v2.9.6 exactly: this job is the early-warning system for an
# upstream Deno 2.9 release breaking the type-check or the test suite, and a
# pinned version here would remove that signal. Release jobs pin because
# `deno desktop` is experimental — a new 2.9 patch can change packaging
# behaviour mid-release. Do not "fix" the inconsistency.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
# Runner image: PINNED, not `ubuntu-latest`.
#
# `ubuntu-latest` resolves to 24.04 today (measured in this workflow's own run logs) and 26.04 is
# only a PUBLIC PREVIEW, so `-latest` will move the OS under a release with no commit to review —
# and this pipeline's version is commit-derived, so an unreviewed OS change lands in a release.
# Pinning makes the migration a deliberate, testable step: bump this line, run the workflow, read
# the log. `check.yml` floats its Deno version on purpose (see that file); the runner is pinned
# for the opposite reason.
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Type check
        run: deno check main.ts
        working-directory: server
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          # Several tests spawn ffmpeg for real (fmp4 muxing, export, engine E2E).
          # GitHub runners do NOT ship it, so they failed with
          # "NotFound: Failed to spawn 'ffmpeg': entity not found" on the first
          # real CI run -- while passing locally on a machine that has it. The
          # production code no longer depends on PATH (the packaged app bundles
          # its own), but the TESTS still invoke the bare name.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Unit tests
        run: deno test --allow-all
        working-directory: server

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: svelte-check
        run: npm run check
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend