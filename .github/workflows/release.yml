# SemaClip nightly release pipeline.
#
# Nightly channel only. A stable channel (tag push `v*`) would reuse the build and
# verify jobs and differ only in the version source and manifest path.
#
# Shape: version -> build (matrix) -> publish -> patch -> verify.
# Jobs that produce a user-visible claim (a release, a manifest, a patch) are
# followed by a job that fetches the result back and hashes it. `deno desktop`
# is EXPERIMENTAL, so the Deno version is pinned exactly and the pipeline is
# written to fail loudly rather than publish something plausible that was never
# actually produced.
#
# Manifest/patch JSON surgery lives in scripts/ci/manifest.py, NOT inline here:
# a `run: |` block passes its own indentation into the script, so an inline
# `python3 - <<'PY'` body arrives indented and both breaks (IndentationError) and
# leaves the `PY` terminator unterminated. The helper is self-testing —
# `python3 scripts/ci/manifest.py self-test`.
name: release

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Build the artifacts only; do not create a release or touch the manifest."
        type: boolean
        default: false
  push:
    branches: [main]
    # A docs-only push still changes the commit count, so without this every
    # typo fix in a markdown file would cut a nightly release — and the version
    # is commit-derived, so each no-op nightly moves every user's version.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "README.md"

# Two runs racing would both try to create the same tag and both push a manifest
# to the releases branch; the second push wins and the loser's patch entry is
# dropped. Serialise instead.
concurrency:
  group: release-nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  # EXACT version, not v2.9.x: `deno desktop` is experimental and an upstream
  # release can change packaging behaviour. Bump this deliberately, then re-cut.
  # (check.yml deliberately floats; see the note at the top of that file.)
  DENO_VERSION: v2.9.6
  NODE_VERSION: "22"
  CHANNEL_DIR: nightly
  # Pin DENO_DIR into the workspace so both matrix runners share one cache path:
  # the default is ~/.cache/deno on Linux but %LOCALAPPDATA%\deno on Windows, so
  # a cache keyed on the default path would silently miss.
  DENO_DIR: ${{ github.workspace }}/.deno-dir
  # Public base URL the updater polls. Must stay in sync with
  # server/deno.json -> desktop.release.baseUrl; a mismatch means the app looks
  # for its patch somewhere CI never published it.
  MANIFEST_BASE_URL: https://99oblivius.github.io/SemaClip

jobs:
  # ── version ────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # version.sh counts commits this year; a shallow clone counts from the
          # clone point and silently produces a wrong (smaller) version.
          fetch-depth: 0

      - name: Compute the nightly version
        id: compute
        run: |
          set -euo pipefail
          out="$(./scripts/version.sh --nightly)"
          printf '%s\n' "$out"

          version="$(printf '%s\n' "$out" | sed -n 's/^version=//p')"
          tag="$(printf '%s\n' "$out" | sed -n 's/^tag=//p')"
          mode="$(printf '%s\n' "$out" | sed -n 's/^mode=//p')"

          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::version.sh printed no version/tag (mode=${mode:-unset})"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag '$tag' is not 'v' + version '$version'"
            exit 1
          fi
          # The nightly suffix keys the manifest entry: without it a nightly and a
          # stable build of the same commit claim one version and the updater sees
          # no change (see version.sh's header).
          case "$version" in
            *-nightly.*) ;;
            *) echo "::error::expected a -nightly.<run> suffix on '$version'"; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assert both version files carry it
        run: python3 scripts/ci/manifest.py version-files "${{ steps.compute.outputs.version }}"
      - name: Record the version for the build jobs
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' \
            "version=${{ steps.compute.outputs.version }}" \
            "tag=${{ steps.compute.outputs.tag }}" \
            > dist/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: dist/VERSION.txt
          retention-days: 7

  # ── build ──────────────────────────────────────────────────────────────────
  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both targets build on ubuntu-latest: `deno desktop` cross-compiles, and
          # scripts/fetch-native.sh can populate a win-x64 payload from a Linux
          # host. A Windows runner would add cost and change nothing.
          #
          # Only `platform` is carried: scripts/build-desktop.ts owns the mapping
          # from this slug to the Rust triple, so listing the triple here too would
          # be a second source of truth for a value that must agree with the native
          # tree — the exact drift this repo keeps re-learning.
          - platform: linux-x64
          - platform: win-x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the Deno toolchain (denort + webview backend)
        uses: actions/cache@v4
        with:
          # Every `deno desktop` run otherwise re-downloads libdenort-<target>.zip
          # from dl.deno.land and the laufey-webview backend — tens of MB per job
          # per platform, inheriting upstream flakiness each time.
          path: ${{ env.DENO_DIR }}
          key: deno-${{ env.DENO_VERSION }}-${{ matrix.platform }}-${{ hashFiles('server/deno.lock', 'frontend/package-lock.json') }}
          restore-keys: |
            deno-${{ env.DENO_VERSION }}-${{ matrix.platform }}-

      - name: Frontend build
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
        working-directory: frontend

      - name: Fetch the native tree for the TARGET platform
        env:
          # Required: the script otherwise derives the platform from uname (the
          # HOST) and embeds Linux binaries in a Windows build — a build that
          # succeeds and ships broken.
          SEMACLIP_NATIVE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/fetch-native.sh

      - name: Re-derive the version and cross-check it
        run: |
          set -euo pipefail
          # Same GITHUB_RUN_NUMBER as the version job, so this must agree. If it
          # does not, the version baked into the binary differs from the one about
          # to be tagged and published — the failure the updater cannot recover
          # from, because it compares the two.
          out="$(./scripts/version.sh --nightly)"
          version="$(printf '%s\n' "$out" | sed -n 's/^version=//p')"
          if [ "$version" != "${{ needs.version.outputs.version }}" ]; then
            echo "::error::build computed '$version', version job computed '${{ needs.version.outputs.version }}'"
            exit 1
          fi
          echo "baked version: $version"

      - name: Install rcedit + wine (Windows icon on the launcher)
        if: matrix.platform == 'win-x64'
        run: |
          set -euo pipefail
          # deno desktop puts the icon on the payload DLL, not the launcher EXE,
          # and Windows reads a GUI process's taskbar/Explorer icon from the
          # launcher -- so a shipped installer showed the default Deno icon.
          # rcedit is what Electron/Tauri use; it is a Windows binary, so wine
          # runs it here. The build wrapper applies it automatically and fails
          # loudly if rcedit is present but the icon still does not land.
          REDIT_VERSION="v2.0.0"
          curl -sSL --fail --max-time 120 \
            -o "$RUNNER_TEMP/rcedit.exe" \
            "https://github.com/electron/rcedit/releases/download/$REDIT_VERSION/rcedit-x64.exe"
          # BOTH of these are needed BY THE PACKAGING STEP, which runs after this
          # one -- $GITHUB_ENV is the right mechanism for that. They must NOT be
          # relied on within this step, where only shell variables exist yet.
          echo "RCEDIT_PATH=$RUNNER_TEMP/rcedit.exe" >> "$GITHUB_ENV"
          sudo -S -p '' apt-get update -qq
          sudo -S -p '' apt-get install -y --no-install-recommends wine64
          # MEASURED in a real ubuntu:24.04 container, because two CI runs were
          # spent guessing: the wine64 package puts NOTHING on PATH (`dpkg -L
          # wine64` has no bin/ entries), the loader lives at /usr/lib/wine/wine64,
          # and a `wine` SYMLINK to it fails with "could not exec the wine loader".
          # Calling the loader path directly works:
          #   /usr/lib/wine/wine64 /tmp/rcedit.exe --help  ->  Rcedit v2.0.0
          # The script takes the loader via WINELOADER_BIN.
          echo "WINELOADER_BIN=/usr/lib/wine/wine64" >> "$GITHUB_ENV"
          /usr/lib/wine/wine64 --version

      - name: Package for ${{ matrix.platform }}
        env:
          # scripts/build-desktop.ts derives BOTH `--target` and the native tree
          # from this one value, because the app resolves its binaries by the
          # RUNTIME os (Deno.build.os), not the build host. Getting the two out of
          # sync is the failure mode that produces a build which compiles and then
          # silently falls back to PATH on the user's machine.
          SEMACLIP_TARGET: ${{ matrix.platform }}
          # Absolute: the wrapper runs deno desktop with cwd=server/, so a relative
          # OUT would resolve there rather than at the repo root.
          OUT: ${{ github.workspace }}/dist/SemaClip
          # Linux users get a single-file AppImage; Windows ships the directory.
          # With SEMACLIP_APPIMAGE=1 the wrapper emits the .AppImage AND leaves the
          # unpacked directory beside it (measured: SemaClip.AppImage 277MB plus
          # SemaClip/SemaClip.so 577MB), so the dylib the patch job diffs comes out
          # of the same single build — no second packaging run.
          SEMACLIP_APPIMAGE: ${{ matrix.platform == 'linux-x64' && '1' || '' }}
        run: |
          set -euo pipefail
          # The wrapper also --excludes the OTHER platforms' native subtrees, which
          # matters three ways: the download shrinks, and bsdiff's input — the thing
          # its ~17x memory factor multiplies — shrinks with it. Measured: the
          # Linux payload is 277MB (AppImage) / 577MB (runtime dylib) with the
          # exclusions, against 473MB / 560MB before them.
          #
          # Produce an .msi on this Linux runner — deno desktop authors it in
          # pure Rust and cross-compiles, so no Windows host is needed.
          #
          # The version scheme had to change for this to be possible: Windows
          # Installer packs ProductVersion as major(0-255).minor(0-255).build
          # (0-65535), so the original v{year}.{patch} (major 2026) was rejected
          # outright. versions are now v{yy}.{patch} (26.148), which fits.
          deno run --allow-all scripts/build-desktop.ts

      - name: Collect the Windows installer + portable zip
        if: matrix.platform == 'win-x64'
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mv dist/SemaClip.msi "dist/SemaClip-$V-win-x64.msi"
          cd dist
          # The portable zip IS the update payload: the sidecar downloads it and
          # swaps its contents into the install directory. It must not carry the
          # updater (a running image cannot be overwritten on Windows — the
          # updater ships with the installer only), but it MUST carry
          # version.txt, or a client that applies this payload has no record of
          # what it just installed.
          zip -qr "SemaClip-$V-win-x64-portable.zip" SemaClip -x "SemaClip/SemaClipUpdater.exe"
          # Fail loudly if the payload cannot stand on its own. A silent omission
          # here is invisible until a Windows client tries to update.
          unzip -l "SemaClip-$V-win-x64-portable.zip" | grep -q "SemaClip/version.txt" \
            || { echo "::error::portable zip has no version.txt — the payload cannot identify itself"; exit 1; }
          echo "portable payload contents:"
          unzip -l "SemaClip-$V-win-x64-portable.zip" | tail -n +4 | head -n -2

      - name: Collect artifact, sidecar, runtime dylib
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          P="${{ matrix.platform }}"

          case "$P" in
            linux-x64) ART="dist/SemaClip.AppImage" ;;
            win-x64) ART="dist/SemaClip-$V-win-x64.msi" ;;
            *) echo "::error::unhandled platform $P"; exit 1 ;;
          esac

          if [ ! -f "$ART" ]; then
            echo "::error::expected artifact '$ART' was not produced"
            find dist -maxdepth 3 -type f | sed 's/^/  /'
            exit 1
          fi
          sha256sum "$ART" | awk '{print $1}' > "$ART.sha256"
          echo "artifact $ART ($(wc -c < "$ART") bytes) sha256=$(cat "$ART.sha256")"

          # Every uploaded artifact needs a sidecar, including the Windows
          # portable zip. The first real CI run failed with
          # "missing ...-win-x64-portable.zip.sha256" because only the primary
          # artifact was hashed here while both are uploaded and released.
          if [ "$P" = "win-x64" ]; then
            ZIP="dist/SemaClip-$V-win-x64-portable.zip"
            [ -f "$ZIP" ] || { echo "::error::expected portable zip '$ZIP' missing"; exit 1; }
            sha256sum "$ZIP" | awk '{print $1}' > "$ZIP.sha256"
            echo "portable zip $ZIP sha256=$(cat "$ZIP.sha256")"
          fi

          # The runtime dylib (<App>.so / <App>.dll) carries the whole ~560MB
          # payload and is what the launcher swaps. It is published so the NEXT
          # nightly's patch job has the "old" side to diff against.
          DYLIB="$(find dist -maxdepth 3 -type f \( -name '*.so' -o -name '*.dll' \) -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "::error::no runtime dylib (*.so/*.dll) in dist — patches cannot be generated"
            find dist -maxdepth 3 -type f | sed 's/^/  /'
            exit 1
          fi
          ext="${DYLIB##*.}"
          cp "$DYLIB" "dist/SemaClip-$V-$P-runtime.$ext"
          sha256sum "dist/SemaClip-$V-$P-runtime.$ext" | awk '{print $1}' \
            > "dist/SemaClip-$V-$P-runtime.$ext.sha256"
          echo "runtime dylib: $DYLIB -> SemaClip-$V-$P-runtime.$ext"

          printf '%s\n' \
            "version=$V" "tag=${{ needs.version.outputs.tag }}" \
            "platform=$P" \
            > "dist/build-meta-$P.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: semaclip-${{ matrix.platform }}
          # Carries the runtime dylib as well as the installer: the patch job
          # diffs that dylib, and re-downloading ~560MB from a release asset to
          # get it would be slower and would require the release to exist first.
          # Paths are named explicitly rather than globbing dist/*, because the
          # unpacked app directory (containing a ~577MB dylib) sits in dist/ too
          # and must not be uploaded twice: it travels as the Windows zip, and as
          # the extracted runtime dylib on Linux.
          path: |
            dist/SemaClip.AppImage
            dist/SemaClip.AppImage.sha256
            # The portable zip is "…-win-x64-portable.zip"; a "*-win-x64.zip"
            # pattern no longer matches anything, which would leave publish
            # looking for an artifact the build never uploaded.
            dist/*-win-x64-portable.zip
            dist/*-win-x64-portable.zip.sha256
            dist/*-win-x64.msi
            dist/*-win-x64.msi.sha256
            dist/*-runtime.*
            dist/build-meta-*.txt
          if-no-files-found: error
          retention-days: 30

  # ── publish ────────────────────────────────────────────────────────────────
  publish:
    needs: [version, build]
    # A fork's push must not create releases here (its token cannot anyway, but
    # failing the guard beats a confusing permissions error mid-job).
    if: github.repository_owner == '99oblivius' && github.event.inputs.skip_publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: semaclip-*
          path: dist
          merge-multiple: true

      - name: Verify the downloaded set before publishing anything
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          ls -la dist
          for f in \
            "dist/SemaClip.AppImage" \
            "dist/SemaClip.AppImage.sha256" \
            "dist/SemaClip-$V-win-x64.msi" \
            "dist/SemaClip-$V-win-x64.msi.sha256" \
            "dist/SemaClip-$V-win-x64-portable.zip" \
            "dist/SemaClip-$V-win-x64-portable.zip.sha256" \
            "dist/SemaClip-$V-linux-x64-runtime.so" \
            "dist/SemaClip-$V-linux-x64-runtime.so.sha256" \
            "dist/SemaClip-$V-win-x64-runtime.dll" \
            "dist/SemaClip-$V-win-x64-runtime.dll.sha256"
          do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          # Hash before upload, not just after: publish must not advertise a
          # sidecar it never checked against the bytes it is about to send.
          for art in \
            "dist/SemaClip.AppImage" \
            "dist/SemaClip-$V-win-x64.msi" \
            "dist/SemaClip-$V-win-x64-portable.zip"
          do
            want="$(cat "$art.sha256")"
            got="$(sha256sum "$art" | awk '{print $1}')"
            [ "$want" = "$got" ] || { echo "::error::$art hash mismatch ($want != $got)"; exit 1; }
            echo "ok $art $got"
          done

      - name: Create the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — the version job must produce a fresh tag"
            exit 1
          fi

          # --prerelease keeps nightlies out of the repo's "latest" slot. The
          # runtime dylibs are attached because the next nightly's patch job needs
          # the previous version to diff from; without them patches cannot exist.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SemaClip $V (nightly)" \
            --prerelease \
            --notes "Nightly build $V from ${GITHUB_SHA:0:12}.

          Linux: \`SemaClip.AppImage\` — chmod +x, then run. Needs \`webkit2gtk\` installed.
          Windows: \`SemaClip-$V-win-x64.msi\` — the installer. \`SemaClip-$V-win-x64-portable.zip\` — no-install fallback, unzip and run \`SemaClip.exe\`.
          Every artifact has a \`.sha256\` sidecar.

          Windows auto-update does not work (the Deno launcher never swaps the DLL in). Linux does. See docs/RELEASING.md." \
            "dist/SemaClip.AppImage" \
            "dist/SemaClip.AppImage.sha256" \
            "dist/SemaClip-$V-win-x64.msi" \
            "dist/SemaClip-$V-win-x64.msi.sha256" \
            "dist/SemaClip-$V-win-x64-portable.zip" \
            "dist/SemaClip-$V-win-x64-portable.zip.sha256" \
            "dist/SemaClip-$V-linux-x64-runtime.so" \
            "dist/SemaClip-$V-linux-x64-runtime.so.sha256" \
            "dist/SemaClip-$V-win-x64-runtime.dll" \
            "dist/SemaClip-$V-win-x64-runtime.dll.sha256"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sed 's/^/published: /'

      - name: Write latest.json for the nightly channel
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ env.CHANNEL_DIR }}"
          python3 scripts/ci/manifest.py init \
            "dist/${{ env.CHANNEL_DIR }}/latest.json" \
            "${{ needs.version.outputs.version }}"

          # The Windows whole-payload artifact. Deno.autoUpdate cannot swap a
          # loaded DLL, so Windows updates via the bundled sidecar and downloads
          # the full portable zip rather than a bsdiff patch. The URL is explicit
          # because the payload lives in the RELEASE while the manifest is served
          # from Pages — without it a client would 404 against the manifest's own
          # directory.
          V="${{ needs.version.outputs.version }}"
          ZIP="SemaClip-$V-win-x64-portable.zip"
          if [ -f "dist/$ZIP" ]; then
            python3 scripts/ci/manifest.py artifact \
              "dist/${{ env.CHANNEL_DIR }}/latest.json" \
              "$V" win-x64 "$ZIP" "$(cat "dist/$ZIP.sha256")" \
              "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/$ZIP"
          else
            echo "::warning::no portable zip in dist; the Windows artifact entry is omitted (Windows clients stay put)"
          fi

      - name: Generate the landing page
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          mkdir -p landing
          # The asset list is built from what is ACTUALLY in dist, so the page can
          # never advertise a file that was not published. NOTE the if/fi form: with
          # `set -e`, a failing `[ -f ] && specs+=(...)` returns non-zero and aborts
          # the whole job, so an OS we do not build for would fail the release.
          specs=()
          if [ -f "dist/SemaClip-$V-win-x64.msi" ]; then
            specs+=("SemaClip-$V-win-x64.msi:windows:x64:Installer (.msi)")
          fi
          if [ -f "dist/SemaClip-$V-win-x64-portable.zip" ]; then
            specs+=("SemaClip-$V-win-x64-portable.zip:windows:x64:Portable (.zip)")
          fi
          if [ -f "dist/SemaClip.AppImage" ]; then
            specs+=("SemaClip.AppImage:linux:x64:AppImage")
          fi
          # landing.py drops the runtime .so/.dll: they are the updater's patch
          # ingredients, not something a user can do anything with.
          python3 scripts/ci/landing.py landing/index.html "$V" "$RELEASE_URL" "${specs[@]}"

      - name: Publish the manifest and the landing page to the releases branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub Pages serves the `releases` branch, and the updater fetches
          # <baseUrl>/latest.json — so the manifest lands at nightly/latest.json.
          # The page goes to the branch ROOT (index.html) because every SemaClip
          # release is a PRERELEASE: GitHub's /releases/latest resolves to the
          # releases LIST, not to a tag, so no tag-free download URL exists and the
          # page must carry the concrete version. Both files ride ONE commit via
          # push-pages.sh, which preserves the patch files the live manifest still
          # references. Plain git push; no third-party Pages action.
          bash scripts/ci/push-pages.sh "$GITHUB_REPOSITORY" "$GH_TOKEN" \
            "dist/${{ env.CHANNEL_DIR }}/latest.json" \
            "${{ env.CHANNEL_DIR }}/latest.json" \
            "landing/index.html" "index.html"

      # ── Ed25519 manifest signing: WIRED BUT NOT ACTIVE ──────────────────────
      # No key exists yet, and SEMACLIP_UPDATE_PUBKEY is unset, so today's clients
      # verify nothing. server/adapters/outbound/platform/auto-update.ts reads
      # SEMACLIP_UPDATE_PUBKEY and passes it to Deno.autoUpdate({...}) as
      # `publicKey`, which turns the manifest into
      #   {"signed": "<the manifest json as a string>",
      #    "signature": "<base64 ed25519 sig over the signed string>"}
      # The key is read from the BAKED-IN ENV of the built app, so signing cannot
      # be switched on for existing installs by changing the manifest alone: an
      # install that does not carry the pubkey keeps accepting unsigned manifests.
      # To activate:
      #   1. generate a key; put base64 of its 32 raw private bytes in the
      #      repository secret SEMACLIP_ED25519_KEY;
      #   2. rebuild the app with SEMACLIP_UPDATE_PUBKEY set to the public key, so
      #      new installs verify (see docs/RELEASING.md step 3 — an existing
      #      install never starts verifying);
      #   3. expose the secret as a JOB-level env (`env:` beside `runs-on`, because
      #      a step cannot read `secrets` in its own `if:` — hence the env guard);
      #   4. uncomment the two steps below, in BOTH this job and `patch`.
      # scripts/ci/sign-manifest.py has never been run against a real key: it is
      # unverified until step 3 of docs/RELEASING.md is done with one.
      #
      # - name: Sign the manifest (Ed25519)
      #   if: env.SEMACLIP_ED25519_KEY != ''
      #   run: |
      #     python3 -m pip install --quiet cryptography
      #     python3 scripts/ci/sign-manifest.py \
      #       "dist/${{ env.CHANNEL_DIR }}/latest.json" \
      #       "$SEMACLIP_ED25519_KEY"

  # ── patch ──────────────────────────────────────────────────────────────────
  patch:
    needs: [version, publish]
    # ON now: the patch generator is qbsdiff, not bsdiff. qbsdiff is the same
    # crate the Deno runtime uses to APPLY patches (so the format is compatible by
    # construction) and it is memory-saving rather than bsdiff's ~17x input.
    # MEASURED on a 560MB dylib pair: 3.29GB peak for a typical version delta,
    # 3.84GB for two wholly unrelated 560MB files — inside ubuntu-latest's ~7GB.
    # Still overridable with SEMACLIP_PATCH_RUNNER if a bigger runner is wanted.
    if: github.repository_owner == '99oblivius' && vars.SEMACLIP_ENABLE_PATCHES != 'false'
    runs-on: ${{ vars.SEMACLIP_PATCH_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight — RAM for the patch generator
        run: |
          set -euo pipefail
          # Measured qbsdiff peak on a 560MB dylib pair: 3.29GB (typical delta),
          # 3.84GB (two unrelated files — the worst case). Require 6GB so there is
          # headroom for the rest of the job. An OOM here would kill the run deep
          # in, not fail cleanly, so checking up front is worth the two lines.
          total_kb="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          total_gb=$(( total_kb / 1024 / 1024 ))
          echo "runner RAM: ~${total_gb}GB"
          if [ "$total_gb" -lt 6 ]; then
            echo "::error::qbsdiff peaks at ~3.8GB on a 560MB dylib pair; this runner has ~${total_gb}GB. Set SEMACLIP_PATCH_RUNNER to a runner with >= 6GB."
            exit 1
          fi

      - name: Install qbsdiff
        run: |
          set -euo pipefail
          # qbsdiff/qbspatch, NOT the classic bsdiff. Two reasons:
          #   1. MEMORY: classic bsdiff needs ~17x the input (~9.5GB for a 560MB
          #      dylib) which OOMs a standard runner; qbsdiff is memory-saving
          #      (measured 3.3-3.8GB, see the preflight above).
          #   2. FORMAT: qbsdiff is the crate the Deno runtime itself uses to apply
          #      patches, so compatibility is by construction.
          # The binaries sit behind a NON-DEFAULT "cmd" feature — without
          # --features cmd the install succeeds and produces no binaries at all,
          # which would look like a working step and fail later at the patch.
          # NO --locked: measured on a genuinely fresh cargo cache, --locked FAILS
          # with "failed to select a version for qbsdiff ... all possible versions
          # conflict" -- the crate's shipped Cargo.lock is self-inconsistent. CI has
          # a cold cache, so --locked would have broken this job on its first real
          # run while looking perfectly reasonable. Verified locally: qbspatch
          # reproduces the target byte-identically.
          cargo install qbsdiff --features cmd
          # ~/.cargo/bin is NOT guaranteed to be on PATH on a runner, and a
          # missing path here would surface much later as "qbsdiff: command not
          # found" inside the patch step. Put it on PATH for later steps and
          # assert BOTH binaries resolve now, not just that install exited 0.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v qbsdiff qbspatch
          qbsdiff --help >/dev/null
          qbspatch --help >/dev/null

      - name: Find the previous nightly
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR="${{ needs.version.outputs.tag }}"

          # The newest nightly other than this one that actually carries a Linux
          # runtime dylib — a release without one cannot be a diff base.
          prev=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                         --exclude-drafts --json tagName,isPrerelease,createdAt \
                         --jq 'sort_by(.createdAt) | reverse | .[] | select(.isPrerelease) | .tagName'); do
            [ "$tag" = "$CUR" ] && continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                 --jq '.assets[].name' | grep -q -- '-linux-x64-runtime\.so$'; then
              prev="$tag"
              break
            fi
          done

          if [ -z "$prev" ]; then
            # First run of the channel. `patches` stays empty and every user stays
            # put — correct behaviour, not a failure.
            echo "::notice::no previous nightly with a runtime dylib; nothing to patch from"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "previous nightly: $prev"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$prev" >> "$GITHUB_OUTPUT"
            echo "version=${prev#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download both runtime dylibs
        if: steps.prev.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          PREV="${{ steps.prev.outputs.version }}"
          mkdir -p work
          # Kept in separate directories: both files share a name, so a flat
          # download would have one silently overwrite the other.
          mkdir -p work/old work/new

          gh release download "${{ steps.prev.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*-linux-x64-runtime.so' --dir work/old
          gh release download "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*-linux-x64-runtime.so' --dir work/new

          OLD="$(find work/old -type f | head -n 1)"
          NEW="$(find work/new -type f | head -n 1)"
          [ -n "$OLD" ] && [ -n "$NEW" ] || { echo "::error::could not fetch both dylibs"; exit 1; }

          cp "$OLD" "work/old-$PREV.so"
          cp "$NEW" "work/new-$V.so"
          ls -la work
          echo "old=$(wc -c < "work/old-$PREV.so") new=$(wc -c < "work/new-$V.so") bytes"

      - name: Generate the patch
        id: diff
        if: steps.prev.outputs.found == 'true'
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          PREV="${{ steps.prev.outputs.version }}"
          NAME="patch-${PREV}-to-${V}.bin"

          # qbsdiff <old> <new> <out>, bsdiff4-compatible — see the RAM preflight
          # above. -P (no parallel search) keeps memory predictable; the measured
          # 3.3-3.8GB figures were taken without it.
          qbsdiff -P "work/old-$PREV.so" "work/new-$V.so" "work/$NAME"

          sha="$(sha256sum "work/$NAME" | awk '{print $1}')"
          echo "patch $NAME sha256=$sha size=$(wc -c < "work/$NAME")"
          printf '%s\n' "$sha" > "work/$NAME.sha256"

          # A patch that applies cleanly can still produce a non-bootable binary,
          # which users only discover via a failed launch + rollback. Applying it
          # is the cheap real check; verify re-runs it from the published copies.
          qbspatch "work/old-$PREV.so" "work/patched.so" "work/$NAME"
          a="$(sha256sum "work/patched.so" | awk '{print $1}')"
          b="$(sha256sum "work/new-$V.so" | awk '{print $1}')"
          if [ "$a" != "$b" ]; then
            echo "::error::patch is not reproducible: patched=$a target=$b"
            exit 1
          fi
          echo "patch round-trip reproduces the new dylib exactly"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload the patch to the release
        if: steps.prev.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "work/${{ steps.diff.outputs.name }}" \
            "work/${{ steps.diff.outputs.name }}.sha256"

      - name: Merge the patch entry into latest.json
        if: steps.prev.outputs.found == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          # Fetch what is actually live rather than the copy publish wrote: this
          # job is also the path that repairs a manifest, and merging into a stale
          # local copy would drop any entry added in between.
          curl -sSfL --max-time 60 \
            "${{ env.MANIFEST_BASE_URL }}/${{ env.CHANNEL_DIR }}/latest.json" \
            -o dist/latest.json

          # Manifest shape: {version, patches: {"<fromVersion>": {name, sha256}}}.
          # Entries are keyed by the version a user is currently on, so every
          # supported prior version needs its own entry; only users listed here can
          # update, and sha256 is mandatory (the runtime refuses a mismatch).
          python3 scripts/ci/manifest.py merge \
            dist/latest.json \
            "${{ needs.version.outputs.version }}" \
            "${{ steps.prev.outputs.version }}" \
            "${{ steps.diff.outputs.name }}" \
            "$(cat "work/${{ steps.diff.outputs.name }}.sha256")"

          # NOTE: no Windows patch is generated, deliberately. Applying an update
          # works on macOS/Linux only — the Windows launcher downloads and stages
          # the patch but never swaps the DLL — so an entry for a Windows version
          # would advertise an update that cannot land.
          #
          # NOTE: this single manifest covers both platforms, but a manifest
          # cannot describe two platforms' dylibs. It is safe only because every
          # entry here is a Linux patch keyed by a Linux version string; a Windows
          # client's version finds no entry and stays put. Adding Windows entries
          # requires per-arch manifest paths (docs/DISTRIBUTION-PLAN.md step 3).

      - name: Republish the manifest and the patch
        if: steps.prev.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Manifest and patch go up in ONE commit: a manifest that names a patch
          # which 404s is refused by the runtime, so the two must never be
          # observable separately.
          bash scripts/ci/push-pages.sh "$GITHUB_REPOSITORY" "$GH_TOKEN" \
            "dist/latest.json" \
            "${{ env.CHANNEL_DIR }}/latest.json" \
            "work/${{ steps.diff.outputs.name }}" \
            "${{ env.CHANNEL_DIR }}/${{ steps.diff.outputs.name }}"

      # Signing must run here too, not only in `publish`: this job rewrites the
      # manifest, so signing only there leaves the FINAL published manifest
      # unsigned and every client trusting the key would refuse it.

  # ── verify ─────────────────────────────────────────────────────────────────
  verify:
    needs: [version, publish, patch]
    # Runs when the patch job was skipped (patches disabled, or no previous
    # nightly): the release and the manifest must still be checked. It fails on
    # its own if either is wrong, so this is not a lenient gate.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.patch.result == 'success' || needs.patch.result == 'skipped' || needs.patch.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published artifacts back from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mkdir -p back

          # From the RELEASE, not the workflow artifacts: the release is what
          # users get, and checking the workflow artifacts would happily pass on
          # bytes that never made it out. Patches are deliberately NOT fetched
          # here — one step below fetches them over the public URL, which is the
          # path the runtime actually uses.
          gh release download "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir back \
            --pattern 'SemaClip.AppImage' \
            --pattern 'SemaClip.AppImage.sha256' \
            --pattern "SemaClip-$V-win-x64.msi" \
            --pattern "SemaClip-$V-win-x64.msi.sha256" \
            --pattern "SemaClip-$V-win-x64-portable.zip" \
            --pattern "SemaClip-$V-win-x64-portable.zip.sha256" \
            --pattern "SemaClip-$V-linux-x64-runtime.so" \
            --pattern "SemaClip-$V-linux-x64-runtime.so.sha256"
          ls -la back

          fail=0
          for art in \
            "SemaClip.AppImage" \
            "SemaClip-$V-win-x64.msi" \
            "SemaClip-$V-win-x64-portable.zip"
          do
            if [ ! -f "back/$art" ] || [ ! -f "back/$art.sha256" ]; then
              echo "::error::release is missing $art or its sidecar"
              fail=1
              continue
            fi
            want="$(cat "back/$art.sha256")"
            got="$(sha256sum "back/$art" | awk '{print $1}')"
            if [ "$want" = "$got" ]; then
              echo "ok  $art $got"
            else
              echo "::error::$art hash mismatch: sidecar=$want actual=$got"
              fail=1
            fi
          done

          # The dylib is the side the next patch diffs from; a corrupt published
          # copy silently poisons the patch after this one.
          d="$V-linux-x64-runtime.so"
          if [ ! -f "back/SemaClip-$d" ] || [ ! -f "back/SemaClip-$d.sha256" ]; then
            echo "::error::release is missing SemaClip-$d or its sidecar"
            fail=1
          else
            want="$(cat "back/SemaClip-$d.sha256")"
            got="$(sha256sum "back/SemaClip-$d" | awk '{print $1}')"
            [ "$want" = "$got" ] && echo "ok  SemaClip-$d $got" \
              || { echo "::error::SemaClip-$d hash mismatch: sidecar=$want actual=$got"; fail=1; }
          fi
          exit $fail

      - name: Verify the live manifest at the Pages URL
        run: |
          set -euo pipefail
          URL="${{ env.MANIFEST_BASE_URL }}/${{ env.CHANNEL_DIR }}/latest.json"

          # A Pages build is asynchronous, so poll — but never claim the manifest
          # is live when it is not. If it never appears, this fails: an updater
          # with no manifest is the whole feature broken, silently.
          ok=no
          for _ in $(seq 1 20); do
            if curl -sSfL --max-time 30 "$URL" -o back/live-latest.json; then ok=yes; break; fi
            echo "manifest not reachable yet; retrying in 15s ($URL)"
            sleep 15
          done
          if [ "$ok" != yes ]; then
            echo "::error::$URL did not become reachable within 5 minutes — the updater would find nothing"
            exit 1
          fi

          python3 scripts/ci/manifest.py check \
            back/live-latest.json "${{ needs.version.outputs.version }}"

      - name: Verify the landing page and every download link it offers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          PAGE="${{ env.MANIFEST_BASE_URL }}/index.html"

          # Poll like the manifest check: Pages publishes asynchronously.
          ok=no
          for _ in $(seq 1 20); do
            if curl -sSfL --max-time 30 "$PAGE" -o back/live-index.html; then ok=yes; break; fi
            echo "landing page not reachable yet; retrying in 15s ($PAGE)"
            sleep 15
          done
          if [ "$ok" != yes ]; then
            echo "::error::$PAGE did not become reachable within 5 minutes"
            exit 1
          fi

          # The page must name THIS version and must not still be advertising an
          # older one — a stale page is how a user downloads the wrong build.
          grep -qF "nightly $V" back/live-index.html \
            || { echo "::error::landing page does not mention nightly $V"; exit 1; }
          grep -qF "pre-alpha" back/live-index.html \
            || { echo "::error::landing page lost the pre-alpha notice"; exit 1; }

          # Every download link on the page must resolve. This is the check that
          # would have caught a page generated against assets that were never
          # uploaded, which is the only way this page can lie.
          mapfile -t LINKS < <(grep -oE 'https://github\.com/[^"]+/releases/download/[^"]+' back/live-index.html | sort -u)
          if [ "${#LINKS[@]}" -eq 0 ]; then
            echo "::error::landing page offers no download links"; exit 1
          fi
          fail=0
          for url in "${LINKS[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 60 -r 0-0 "$url" || true)"
            # 206 for a satisfied range request, 200 if the server ignored Range.
            case "$code" in
              200|206) echo "ok  $code  $url" ;;
              *) echo "::error::download link returned $code: $url"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "landing page verified: ${#LINKS[@]} download link(s) resolve, version $V present"

      - name: Verify every published patch applies
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          n="$(python3 -c 'import json;print(len(json.load(open("back/live-latest.json")).get("patches",{})))')"
          if [ "$n" = "0" ]; then
            echo "::notice::live manifest lists no patches (first nightly, or patches disabled) — nothing to verify"
            exit 0
          fi

          # qbspatch, matching the generator. Using the apt `bsdiff` package here
          # would mean the patch is produced by one implementation and verified by
          # another, so a format mismatch could pass verification or fail it
          # spuriously. One crate on both sides.
          cargo install qbsdiff --features cmd
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v qbspatch

          python3 -c 'import json;m=json.load(open("back/live-latest.json"));[print(k,v["name"],v["sha256"]) for k,v in m["patches"].items()]' \
            > /tmp/patches.txt
          while read -r frm name sha; do
            echo "== patch for $frm -> $V"

            # Fetch the patch over its PUBLIC URL and check the hash the runtime
            # will check. A mismatch means the runtime refuses it and every user
            # on $frm silently never updates.
            curl -sSfL --max-time 300 \
              "${{ env.MANIFEST_BASE_URL }}/${{ env.CHANNEL_DIR }}/$name" -o "back/$name"
            got="$(sha256sum "back/$name" | awk '{print $1}')"
            [ "$got" = "$sha" ] || { echo "::error::$name manifest sha=$sha actual=$got"; exit 1; }

            # Prove it applies: diff $frm's published dylib and confirm the result
            # is byte-identical to this release's dylib. This is the real check —
            # a patch can apply cleanly and still yield a dead binary, and this
            # catches the patch-format/reproducibility class without a display.
            # Booting the patched GUI app is a manual step: CI has no webkit2gtk
            # and no display, so it is NOT claimed here. See docs/RELEASING.md.
            olddir="back/old-$frm"
            mkdir -p "$olddir"
            gh release download "v$frm" --repo "$GITHUB_REPOSITORY" \
              --pattern '*-linux-x64-runtime.so' --dir "$olddir" \
              || { echo "::error::cannot fetch the $frm runtime dylib to check the patch against"; exit 1; }
            old="$(find "$olddir" -name '*-linux-x64-runtime.so' -print -quit)"
            [ -n "$old" ] || { echo "::error::no runtime dylib in the $frm release"; exit 1; }
            target="back/SemaClip-$V-linux-x64-runtime.so"
            [ -f "$target" ] || { echo "::error::missing $target"; exit 1; }

            qbspatch "$old" back/patched.so "back/$name"
            a="$(sha256sum back/patched.so | awk '{print $1}')"
            b="$(sha256sum "$target" | awk '{print $1}')"
            [ "$a" = "$b" ] || { echo "::error::patch $name does not reproduce $V ($a != $b)"; exit 1; }
            echo "ok  $name applies and reproduces $V exactly"
            rm -rf "$olddir" back/patched.so
          done < /tmp/patches.txt

      - name: Summary
        run: |
          {
            echo "## SemaClip nightly ${{ needs.version.outputs.version }}"
            echo
            echo "- tag: \`${{ needs.version.outputs.tag }}\`"
            echo "- manifest: ${{ env.MANIFEST_BASE_URL }}/${{ env.CHANNEL_DIR }}/latest.json"
            echo "- publish: ${{ needs.publish.result }}"
            echo "- patch: ${{ needs.patch.result }}"
            echo
            echo "Verified: release assets hash-match their sidecars, the live manifest"
            echo "parses and names this version, and every listed patch applies (checked"
            echo "by qbspatch against the previous published dylib)."
            echo
            echo "NOT verified here: the patched app actually booting (no display in CI)."
            echo "Windows ships as a zip, not an installer, and Windows auto-update does"
            echo "not work. See docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
